<html>
  <head>
    <style>
      html, body { 
        background-color:#000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;  
      }

      #overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 100;
        user-select: none;
      }
    </style>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';      

      var renderer, controls, scene, camera;
      var LASTOBJECT = null;
      var DRAGGING = false;
      var FLICKERING = false;
      var WIREFRAME = false;
      var TORUSES = [];
      var toruses = TORUSES;
      var was_flickering = false;

      // Parameters for TorusKnotGeometry
      var TK_PARAMS = {
        radius: 10,
        tube: 3,
        tubularSegments: 100,
        radialSegments: 16
      };

      // Expose to window for global access/autograding
      window.LASTOBJECT = LASTOBJECT;
      window.DRAGGING = DRAGGING;
      window.FLICKERING = FLICKERING;
      window.WIREFRAME = WIREFRAME;
      window.TORUSES = TORUSES;
      window.toruses = toruses;

      function updateOverlay() {
        var overlay = document.getElementById( 'overlay' );
        if ( overlay ) {
          overlay.innerHTML =
            '<div><strong>Placed Toruses:</strong> ' + TORUSES.length + '</div>' +
            '<div style="margin-top: 4px;"><strong>TorusKnotGeometry Parameters:</strong></div>' +
            '<div>&bull; radius: ' + TK_PARAMS.radius + '</div>' +
            '<div>&bull; tube: ' + TK_PARAMS.tube + '</div>' +
            '<div>&bull; tubularSegments: ' + TK_PARAMS.tubularSegments + '</div>' +
            '<div>&bull; radialSegments: ' + TK_PARAMS.radialSegments + '</div>';
        }
      }

      window.onload = function() {

        // Three.js scene setup
        scene = new THREE.Scene();

        // setup the camera
        var fov = 75;
        var ratio = window.innerWidth / window.innerHeight;
        var zNear = 1;
        var zFar = 10000;
        camera = new THREE.PerspectiveCamera( fov, ratio, zNear, zFar );
        camera.position.set(0, 0, 100);

        // create renderer and setup the canvas
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize( window.innerWidth, window.innerHeight );
        document.body.appendChild( renderer.domElement );

        // setup lights
        var ambientLight = new THREE.AmbientLight();
        scene.add( ambientLight );

        var light = new THREE.DirectionalLight( 0xffffff, 5.0 );
        light.position.set( 10, 100, 10 );
        scene.add( light );

        // 1. Replace the cube with a solid THREE.TorusKnotGeometry mesh using THREE.MeshStandardMaterial
        var geometry = new THREE.TorusKnotGeometry(
          TK_PARAMS.radius,
          TK_PARAMS.tube,
          TK_PARAMS.tubularSegments,
          TK_PARAMS.radialSegments
        );
        var material = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          wireframe: WIREFRAME
        });

        var torus = new THREE.Mesh( geometry, material );

        scene.add( torus );
        TORUSES.push( torus );
        LASTOBJECT = torus;
        window.LASTOBJECT = LASTOBJECT;

        // Initialize overlay display
        updateOverlay();

        //
        // The invisible plane for mouse raycasting / unprojecting
        //
        var plane_geometry = new THREE.PlaneGeometry( 10000, 10000 );
        var plane_material = new THREE.MeshBasicMaterial( {
          visible: false
        });

        var invisible_plane = new THREE.Mesh( plane_geometry, plane_material );

        scene.add( invisible_plane );

        // 2. onmousedown: Only when SHIFT is held, add a NEW hotpink (#ff69b4) torus knot at that 3D position
        renderer.domElement.onmousedown = function( e ){

          if ( e.shiftKey ) {

            controls.enabled = false;

            var pixel_coords = new THREE.Vector2( e.clientX, e.clientY );

            var vp_coords = new THREE.Vector2( 
              ( pixel_coords.x / window.innerWidth ) * 2 - 1,   // X
              -( pixel_coords.y / window.innerHeight ) * 2 + 1   // Y
            );

            var vp_coords_near = new THREE.Vector3( vp_coords.x, vp_coords.y, 0 );

            var raycaster = new THREE.Raycaster();
            raycaster.setFromCamera( vp_coords_near, camera );
            var intersects = raycaster.intersectObject( invisible_plane );

            if ( intersects.length > 0 ) {

              var new_material = new THREE.MeshStandardMaterial({
                color: 0xff69b4,
                wireframe: WIREFRAME
              });
              var new_torus = new THREE.Mesh( geometry, new_material );
              new_torus.position.set(
                intersects[0].point.x,
                intersects[0].point.y,
                intersects[0].point.z
              );

              scene.add( new_torus );

              TORUSES.push( new_torus );
              LASTOBJECT = new_torus;
              window.LASTOBJECT = LASTOBJECT;

              DRAGGING = true;
              window.DRAGGING = DRAGGING;

              updateOverlay();

            }

          }

        };

        // 3. onmouseup: re-enable controls and stop dragging
        renderer.domElement.onmouseup = function( e ){

          controls.enabled = true;
          DRAGGING = false;
          window.DRAGGING = DRAGGING;

        };
        window.onmouseup = renderer.domElement.onmouseup;

        // 4 & 5. onmousemove: scale LASTOBJECT when DRAGGING and flip color when crossing zero
        renderer.domElement.onmousemove = function( e ){

          if ( DRAGGING ) {

            console.log( e.movementY );

            var DELTA = -e.movementY * 0.01;

            var torus = LASTOBJECT;
            var old_scale = torus.scale.x;

            torus.scale.set(
              torus.scale.x + DELTA,
              torus.scale.y + DELTA,
              torus.scale.z + DELTA
            );

            var new_scale = torus.scale.x;

            // When the scale crosses zero (flips), switch between grassgreen and hotpink
            if ( old_scale > 0 && new_scale <= 0 ) {
              LASTOBJECT.material.color.set( 0x7CFC00 ); // grassgreen (#7CFC00)
            } else if ( old_scale < 0 && new_scale >= 0 ) {
              LASTOBJECT.material.color.set( 0xff69b4 ); // hotpink (#ff69b4)
            }

          }

        };

        // interaction
        controls = new OrbitControls( camera, renderer.domElement );

        // call animation/rendering loop
        animate();

      };

      // 6. window.onkeypress: f toggles FLICKERING, w toggles WIREFRAME
      window.onkeypress = function( e ){

        if ( e.key === 'f' || e.key === 'F' ) {

          FLICKERING = !FLICKERING;
          window.FLICKERING = FLICKERING;

          if ( !FLICKERING ) {
            for ( var t of TORUSES ) {
              t.material.opacity = 1.0;
              t.material.transparent = false;
              t.material.needsUpdate = true;
            }
          }

        } else if ( e.key === 'w' || e.key === 'W' ) {

          WIREFRAME = !WIREFRAME;
          window.WIREFRAME = WIREFRAME;

          for ( var t of TORUSES ) {
            t.material.wireframe = WIREFRAME;
          }

        }

      };

      function animate() {

        requestAnimationFrame( animate );

        // If FLICKERING, randomize opacity of all placed toruses
        if ( FLICKERING ) {
          for ( var t of TORUSES ) {
            t.material.opacity = Math.random();
            t.material.transparent = true;
            t.material.needsUpdate = true;
          }
          was_flickering = true;
        } else if ( was_flickering ) {
          for ( var t of TORUSES ) {
            t.material.opacity = 1.0;
            t.material.transparent = false;
            t.material.needsUpdate = true;
          }
          was_flickering = false;
        }

        controls.update();
        renderer.render( scene, camera );

      }

    </script>
  </head>
  <body>
    <div id="overlay"></div>
  </body>
</html>
